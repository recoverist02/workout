<!doctype html>
<html lang="ko">
<head>
  <meta name="app-shell" content="workout-generic-shell-v1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f4">
  <meta name="description" content="나의 운동, 변화, 그리고 다음 목표.">
  <title>운동기록01</title>
  <style>
    body{margin:0;background:#f6f8f4;color:#24362b;font-family:system-ui,sans-serif}
    .boot{padding:30px;font-size:20px;font-weight:700}
    .boot small{display:block;font-size:13px;font-weight:400;color:#718176;margin-top:12px}
  </style>
  <script>
    (() => {
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPdMt8y24U1ScTMCSqTEX3EOnjSzGlOTN1ffndNBKKIzBps6t2lLLdadHP0wbfJUwn/exec';
      const CHANNEL = 'workout-sheets-v1';
      const USER_ID = 'recoverist02';
      const pending = new Map();
      let source = null;
      let resolveReady;
      const ready = new Promise(resolve => { resolveReady = resolve; });

      window.addEventListener('message', event => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!source) {
            source = event.source;
            resolveReady();
          }
          return;
        }
        if (event.source !== source) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      function mountBridgeFrame() {
        const frame = document.createElement('iframe');
        frame.title = '운동기록01 Google Sheets 연결';
        frame.setAttribute('aria-hidden', 'true');
        frame.tabIndex = -1;
        frame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0';
        frame.src = GAS_URL + '?bridge=1';
        (document.body || document.documentElement).appendChild(frame);
      }
      if (document.body) mountBridgeFrame();
      else window.addEventListener('DOMContentLoaded', mountBridgeFrame, { once: true });

      async function callBridge(payload) {
        let waitTimer;
        await Promise.race([
          ready,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => reject(new Error('구글 시트 연결이 지연되고 있어. 앱스크립트 새 버전 배포를 확인해줘.')), 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('시트 응답이 늦어지고 있어. 새로고침 후 다시 확인해줘.'));
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          source.postMessage({ channel: CHANNEL, id: id, payload: payload }, '*');
        });
      }

      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const rawUrl = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        let parsed;
        try { parsed = new URL(rawUrl, location.origin); } catch (_) { return nativeFetch(input, init); }
        if (!parsed.pathname.endsWith('/api/state') && !parsed.pathname.endsWith('/api/record') && !parsed.pathname.endsWith('/api/sheets/migrate')) {
          return nativeFetch(input, init);
        }

        const method = String(init.method || 'GET').toUpperCase();
        let body = {};
        if (init.body) {
          try { body = JSON.parse(init.body); } catch (_) {}
        }

        try {
          let reqPayload;
          if (parsed.pathname.endsWith('/api/state')) {
            if (method === 'GET') {
              const scope = parsed.searchParams.get('scope');
              const isBootstrap = parsed.searchParams.get('bootstrap') === '1';
              reqPayload = { action: 'read', scope: scope === 'extra' ? 'extra' : (isBootstrap ? 'journal' : undefined) };
            } else {
              reqPayload = { action: 'save', sheets: body.sheets, revision: body.revision };
            }
          } else if (parsed.pathname.endsWith('/api/record')) {
            if (method === 'PUT') {
              reqPayload = { action: 'saveRecord', table: body.table, row: body.row, previous: body.previous ?? null, deferScore: true };
            } else if (method === 'DELETE') {
              reqPayload = { action: 'deleteRecord', table: body.table, id: body.id };
            } else if (body.action === 'recordScore') {
              reqPayload = { action: 'recordScore', table: body.table, id: body.id };
            } else {
              reqPayload = { action: 'recordStatus', table: body.table, id: body.id };
            }
          } else {
            reqPayload = { action: 'read' };
          }

          const result = await callBridge(reqPayload);
          const ok = result && result.ok !== false;
          return new Response(JSON.stringify(result || { error: '빈 응답' }), {
            status: ok ? 200 : 400,
            headers: {
              'Content-Type': 'application/json',
              'X-Workout-User': USER_ID
            }
          });
        } catch (err) {
          return new Response(JSON.stringify({ ok: false, error: err && err.message ? err.message : String(err) }), {
            status: 500,
            headers: {
              'Content-Type': 'application/json',
              'X-Workout-User': USER_ID
            }
          });
        }
      };
    })();
  </script>
