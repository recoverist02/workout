<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8f4" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>운동기록01</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f6f8f4;
      color: #24362b;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f6f8f4;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: #f6f8f4;
      z-index: 10;
      transition: opacity 0.15s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-title {
      font-size: 20px;
      font-weight: 800;
      color: #24362b;
    }
    .boot-sub {
      font-size: 13px;
      color: #718176;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="boot-title">운동기록01</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 초고속으로 불러오는 중…</div>
  </div>

  <iframe id="appFrame" title="운동기록01"></iframe>

  <script>
    (() => {
      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app';
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPdMt8y24U1ScTMCSqTEX3EOnjSzGlOTN1ffndNBKKIzBps6t2lLLdadHP0wbfJUwn/exec';
      const CHANNEL = 'workout-sheets-v1';

      const TABLE_WIDTHS = {
        '운동기록': 16, '운동리스트': 4, '현황': 21, '신체수치': 9,
        '목표': 12, '신체수치현황': 24, '운동계획': 6, '식단계획': 5,
        '건강데이터': 8, '주간브리핑': 10, '브리핑이력': 17
      };

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');
      const cleanFbUrl = FIREBASE_DB_URL.replace(/\/+$/, '');

      // [핵심] Firebase가 숫자 키 객체({"0":..., "15":...})로 변환한 행과 테이블을 100% 정상 2차원 배열로 복원
      function normalizeRow(rawRow, width) {
        if (rawRow == null || typeof rawRow !== 'object') {
          return Array.from({ length: width || 0 }, () => null);
        }
        const numKeys = Array.isArray(rawRow)
          ? []
          : Object.keys(rawRow).map(Number).filter(Number.isFinite);
        const maxIdx = Array.isArray(rawRow)
          ? rawRow.length
          : (numKeys.length ? Math.max(...numKeys) + 1 : 0);
        const len = width || maxIdx;
        return Array.from({ length: len }, (_, i) => {
          const v = rawRow[i];
          return v === undefined || v === '' ? null : v;
        });
      }

      function normalizeSheets(rawSheets) {
        if (!rawSheets || typeof rawSheets !== 'object') return {};
        const out = {};
        for (const [name, table] of Object.entries(rawSheets)) {
          const width = TABLE_WIDTHS[name] || 0;
          if (!table || typeof table !== 'object') {
            out[name] = [];
            continue;
          }
          const rowsList = Array.isArray(table)
            ? table
            : Object.keys(table)
                .map(Number)
                .filter(Number.isFinite)
                .sort((a, b) => a - b)
                .map(k => table[k]);

          out[name] = rowsList
            .filter(r => r != null && typeof r === 'object')
            .map(r => normalizeRow(r, width));
        }
        return out;
      }

      function unpackCloudPayload(d) {
        if (!d || d.ok === false) return null;
        if (typeof d.sheetsJSON === 'string') {
          try {
            d.sheets = normalizeSheets(JSON.parse(d.sheetsJSON));
            return d;
          } catch (_) {}
        }
        if (d.sheets) {
          d.sheets = normalizeSheets(d.sheets);
          return d;
        }
        return null;
      }

      window.__normalizeWorkoutSheets = normalizeSheets;
      window.__normalizeWorkoutRow = normalizeRow;

      // 1. 페이지 시작 즉시 클라우드 데이터와 app.html을 병렬로 프리패치
      let cachedMain = null;
      let cachedExtra = null;
      let latestWriteSeq = 0;

      const prefetchMainPromise = fetch(`${cleanFbUrl}/workout/state_main.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const unpacked = unpackCloudPayload(d);
          if (unpacked) cachedMain = unpacked;
          return cachedMain;
        })
        .catch(() => null);

      const prefetchExtraPromise = fetch(`${cleanFbUrl}/workout/state_extra.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const unpacked = unpackCloudPayload(d);
          if (unpacked) cachedExtra = unpacked;
          return cachedExtra;
        })
        .catch(() => null);

      const prefetchShellPromise = fetch('./app.html?v=status-compact-2', { cache: 'no-store' })
        .then(r => (r.ok ? r.text() : null))
        .catch(() => null);

      // 2. 구글 시트 백업용 숨김 브리지 연결
      let bridgeSource = null;
      let resolveBridgeReady = null;
      const pending = new Map();
      const bridgeReady = new Promise(resolve => { resolveBridgeReady = resolve; });

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      const bridgeFrame = document.createElement('iframe');
      bridgeFrame.title = '운동기록01 시트 백업 연결';
      bridgeFrame.setAttribute('aria-hidden', 'true');
      bridgeFrame.tabIndex = -1;
      bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0';
      bridgeFrame.src = GAS_URL + '?bridge=1';
      document.body.appendChild(bridgeFrame);

      window.__workoutBridgeCall = async (payload) => {
        let waitTimer;
        await Promise.race([
          bridgeReady,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => reject(new Error('시트 백업 연결 지연')), 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('시트 백업 응답 시간 초과'));
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({ channel: CHANNEL, id, payload }, '*');
        });
      };

      // 3. 수행점수 즉시 계산 함수 (시트 수식과 동일)
      function calcWorkoutScore(row) {
        if (!Array.isArray(row)) return null;
        if (row[2] === '유산소') {
          return row[13] == null || row[13] === '' ? null : Number(row[13]);
        }
        const totalReps = row.slice(6, 11).reduce((sum, v) => sum + (Number(v) > 0 ? Number(v) : 0), 0);
        const weight = Number(row[5]);
        if (!Number.isFinite(weight) || weight <= 0 || totalReps <= 0) return null;
        const val = (weight * totalReps * Math.log(weight / 5 + 1)) / 100;
        return Number.isFinite(val) ? Math.round(val) : null;
      }

      async function writeCloud(key, data) {
        if (!data || data.ok === false) return;
        const cleanSheets = normalizeSheets(data.sheets || {});
        const payloadToSave = {
          ...data,
          sheets: cleanSheets,
          sheetsJSON: JSON.stringify(cleanSheets)
        };
        try {
          await fetch(`${cleanFbUrl}/workout/${key}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadToSave)
          });
        } catch (_) {}
      }

      // 백그라운드 시트 백업
      function backupToSheetInBackground(payload, seq) {
        window.__workoutBridgeCall(payload)
          .then(res => {
            if (seq !== latestWriteSeq || !res || res.ok === false) return;
            if (payload.action === 'saveRecord' && res.row && Array.isArray(cachedMain?.sheets?.[payload.table])) {
              const rows = cachedMain.sheets[payload.table];
              const cleanRow = normalizeRow(res.row, TABLE_WIDTHS[payload.table]);
              const idx = rows.findIndex((r, i) => i > 0 && String(r[0]) === String(cleanRow[0]));
              if (idx > 0) {
                rows[idx] = cleanRow;
                writeCloud('state_main', cachedMain);
              }
            }
          })
          .catch(() => {});
      }

      // 4. 클라우드 메인 + 시트 백업 하이브리드 라우터
      window.__workoutHybridCall = async (payload) => {
        const started = performance.now();

        // [조회] 클라우드에서 0.1초 만에 정규화된 2차원 배열로 반환
        if (payload && payload.action === 'read') {
          const isExtra = payload.scope === 'extra';
          if (isExtra) {
            // 걸음수·수면은 시트에 별도로 들어오므로 최신값을 조회한다.
            const fresh = await window.__workoutBridgeCall({
              action: 'read',
              scope: 'extra'
            });

            if (!fresh || fresh.ok === false || !fresh.sheets) {
              throw new Error(
                fresh?.error ||
                '걸음수·수면 최신 데이터를 불러오지 못했어. 새로고침해서 다시 시도해줘.'
              );
            }

            const sheets = normalizeSheets(fresh.sheets);
            cachedExtra = { ...fresh, sheets };

            // 운동기록 등 편집 가능한 데이터는 그대로 유지한다.
            const editable = new Set([
              '운동기록', '신체수치', '운동리스트',
              '목표', '운동계획', '식단계획'
            ]);
            const extras = Object.fromEntries(
              Object.entries(sheets).filter(
                ([name]) => !editable.has(name)
              )
            );

            if (cachedMain) {
              cachedMain = {
                ...cachedMain,
                sheets: { ...cachedMain.sheets, ...extras }
              };
            }

            // 다음 접속에서도 사용할 수 있도록 추가 데이터 캐시 갱신
            void writeCloud('state_extra', cachedExtra);

            return {
              ...cachedExtra,
              source: 'sheets',
              bridgeReady: true,
              protocol: 2,
              timing: { totalMs: performance.now() - started }
            };
          } else {
            const main = cachedMain || (await prefetchMainPromise);
            const extra = cachedExtra || (await prefetchExtraPromise);
            if (main && main.sheets) {
              const mergedSheets = normalizeSheets(
                extra && extra.sheets ? { ...extra.sheets, ...main.sheets } : main.sheets
              );
              cachedMain = {
                ...main,
                ok: true,
                source: 'sheets',
                bridgeReady: true,
                initialized: true,
                protocol: 2,
                partial: true,
                sheets: mergedSheets
              };
              return { ...cachedMain, timing: { totalMs: performance.now() - started } };
            }
          }

          const sheetData = await window.__workoutBridgeCall(payload);
          if (sheetData && sheetData.ok !== false) {
            sheetData.sheets = normalizeSheets(sheetData.sheets);
            if (isExtra) {
              cachedExtra = sheetData;
              await writeCloud('state_extra', sheetData);
            } else {
              cachedMain = sheetData;
              await writeCloud('state_main', sheetData);
            }
          }
          return sheetData;
        }

        // [단건 기록 저장·수정] 클라우드 즉시 저장 + 시트 백그라운드 백업
        if (payload && payload.action === 'saveRecord') {
          const main = cachedMain || (await prefetchMainPromise);
          if (!main || !main.sheets) throw new Error('클라우드 데이터를 먼저 불러와줘.');
          const sheets = normalizeSheets(main.sheets);
          const table = payload.table;
          const row = normalizeRow(payload.row, TABLE_WIDTHS[table]);
          if (table === '운동기록') {
            row[15] = calcWorkoutScore(row);
          }
          const rows = Array.isArray(sheets[table]) ? [...sheets[table]] : [];
          const idx = rows.findIndex((r, i) => i > 0 && String(r[0]) === String(row[0]));
          if (idx > 0) rows[idx] = row;
          else rows.push(row);

          const nextRev = String(Date.now());
          cachedMain = {
            ...main,
            revision: nextRev,
            updatedAt: Date.now(),
            sheets: { ...sheets, [table]: rows }
          };

          const mySeq = ++latestWriteSeq;
          await writeCloud('state_main', cachedMain);
          backupToSheetInBackground({ ...payload, row, deferScore: false }, mySeq);

          return {
            ok: true,
            source: 'sheets',
            protocol: 2,
            table,
            id: String(row[0]),
            row,
            revision: nextRev,
            scorePending: false,
            timing: { totalMs: performance.now() - started }
          };
        }

        // [단건 기록 삭제] 클라우드 즉시 삭제 + 시트 백그라운드 백업
        if (payload && payload.action === 'deleteRecord') {
          const main = cachedMain || (await prefetchMainPromise);
          if (!main || !main.sheets) throw new Error('클라우드 데이터를 먼저 불러와줘.');
          const sheets = normalizeSheets(main.sheets);
          const table = payload.table;
          const id = String(payload.id);
          const rows = (Array.isArray(sheets[table]) ? sheets[table] : []).filter((r, i) => i === 0 || String(r[0]) !== id);

          const nextRev = String(Date.now());
          cachedMain = {
            ...main,
            revision: nextRev,
            updatedAt: Date.now(),
            sheets: { ...sheets, [table]: rows }
          };

          const mySeq = ++latestWriteSeq;
          await writeCloud('state_main', cachedMain);
          backupToSheetInBackground(payload, mySeq);

          return {
            ok: true,
            source: 'sheets',
            protocol: 2,
            table,
            id,
            exists: false,
            deleted: true,
            revision: nextRev,
            timing: { totalMs: performance.now() - started }
          };
        }

        // [점수/상태 확인] 클라우드 메모리에서 즉시 응답
        if (payload && (payload.action === 'recordScore' || payload.action === 'recordStatus')) {
          const main = cachedMain || (await prefetchMainPromise);
          const sheets = normalizeSheets(main?.sheets || {});
          const rows = Array.isArray(sheets[payload.table]) ? sheets[payload.table] : [];
          const found = rows.find((r, i) => i > 0 && String(r[0]) === String(payload.id)) || null;
          return {
            ok: true,
            source: 'sheets',
            protocol: 2,
            table: payload.table,
            id: payload.id,
            row: found,
            exists: !!found,
            timing: { totalMs: performance.now() - started }
          };
        }

        // [전체 테이블 저장] 클라우드 즉시 저장 + 시트 백그라운드 백업
        if (payload && payload.action === 'save') {
          const main = cachedMain || (await prefetchMainPromise);
          const nextRev = String(Date.now());
          const merged = normalizeSheets({ ...(main?.sheets || {}), ...payload.sheets });
          cachedMain = {
            ...(main || {}),
            ok: true,
            source: 'sheets',
            bridgeReady: true,
            initialized: true,
            protocol: 2,
            partial: false,
            revision: nextRev,
            updatedAt: Date.now(),
            sheets: merged
          };
          const mySeq = ++latestWriteSeq;
          await writeCloud('state_main', cachedMain);
          backupToSheetInBackground({ ...payload, sheets: merged }, mySeq);
          return { ...cachedMain, timing: { totalMs: performance.now() - started } };
        }

        return window.__workoutBridgeCall(payload);
      };

      function injectBridgeIntoAppHtml(rawHtml) {
        const closeTag = '<' + '/script>';
        const shim =
          '<script>\n' +
          '(() => {\n' +
          '  const USER_ID = "recoverist02";\n' +
          '  // 브라우저 localStorage에 남아있는 이전 객체형 캐시를 정상 배열로 즉시 복원\n' +
          '  try {\n' +
          '    const ck = "workout-cache-v1:" + USER_ID;\n' +
          '    const rawCache = localStorage.getItem(ck);\n' +
          '    if (rawCache && window.parent.__normalizeWorkoutSheets) {\n' +
          '      const parsed = JSON.parse(rawCache);\n' +
          '      if (parsed && parsed.sheets) {\n' +
          '        parsed.sheets = window.parent.__normalizeWorkoutSheets(parsed.sheets);\n' +
          '        localStorage.setItem(ck, JSON.stringify(parsed));\n' +
          '      }\n' +
          '    }\n' +
          '    const pk = "workout-pending-v1:" + USER_ID;\n' +
          '    const rawPending = localStorage.getItem(pk);\n' +
          '    if (rawPending && window.parent.__normalizeWorkoutRow) {\n' +
          '      const p = JSON.parse(rawPending);\n' +
          '      if (p && p.row) {\n' +
          '        p.row = window.parent.__normalizeWorkoutRow(p.row, p.key === "운동기록" ? 16 : 9);\n' +
          '        localStorage.setItem(pk, JSON.stringify(p));\n' +
          '      }\n' +
          '    }\n' +
          '  } catch (_) {\n' +
          '    localStorage.removeItem("workout-cache-v1:" + USER_ID);\n' +
          '  }\n' +
          '  function makeResponse(data, status) {\n' +
          '    if (data && data.sheets && window.parent.__normalizeWorkoutSheets) {\n' +
          '      data.sheets = window.parent.__normalizeWorkoutSheets(data.sheets);\n' +
          '    }\n' +
          '    if (data && data.row && window.parent.__normalizeWorkoutRow) {\n' +
          '      data.row = window.parent.__normalizeWorkoutRow(data.row, data.table === "운동기록" ? 16 : 9);\n' +
          '    }\n' +
          '    return {\n' +
          '      ok: status >= 200 && status < 300,\n' +
          '      status: status,\n' +
          '      headers: {\n' +
          '        get(k) {\n' +
          '          const n = String(k || "").toLowerCase();\n' +
          '          if (n === "x-workout-user") return USER_ID;\n' +
          '          if (n === "content-type") return "application/json";\n' +
          '          return null;\n' +
          '        }\n' +
          '      },\n' +
          '      async json() { return JSON.parse(JSON.stringify(data)); },\n' +
          '      async text() { return JSON.stringify(data); }\n' +
          '    };\n' +
          '  }\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init = {}) => {\n' +
          '    const raw = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    let u;\n' +
          '    try { u = new URL(raw, "https://recoverist02.github.io"); } catch (_) { return origFetch(input, init); }\n' +
          '    if (!u.pathname.endsWith("/api/state") && !u.pathname.endsWith("/api/record") && !u.pathname.endsWith("/api/sheets/migrate")) {\n' +
          '      return origFetch(input, init);\n' +
          '    }\n' +
          '    const method = String(init.method || "GET").toUpperCase();\n' +
          '    let body = {};\n' +
          '    if (init.body) { try { body = JSON.parse(init.body); } catch (_) {} }\n' +
          '    try {\n' +
          '      let payload;\n' +
          '      if (u.pathname.endsWith("/api/state")) {\n' +
          '        if (method === "GET") {\n' +
          '          const scope = u.searchParams.get("scope");\n' +
          '          payload = { action: "read", scope: scope === "extra" ? "extra" : undefined };\n' +
          '        } else {\n' +
          '          payload = { action: "save", sheets: body.sheets, revision: body.revision };\n' +
          '        }\n' +
          '      } else if (u.pathname.endsWith("/api/record")) {\n' +
          '        if (method === "PUT") payload = { action: "saveRecord", table: body.table, row: body.row, previous: body.previous ?? null, deferScore: false };\n' +
          '        else if (method === "DELETE") payload = { action: "deleteRecord", table: body.table, id: body.id };\n' +
          '        else if (body.action === "recordScore") payload = { action: "recordScore", table: body.table, id: body.id };\n' +
          '        else payload = { action: "recordStatus", table: body.table, id: body.id };\n' +
          '      } else {\n' +
          '        payload = { action: "read" };\n' +
          '      }\n' +
          '      const res = await window.parent.__workoutHybridCall(payload);\n' +
          '      return makeResponse(res || { error: "빈 응답" }, res && res.ok !== false ? 200 : 400);\n' +
          '    } catch (err) {\n' +
          '      return makeResponse({ ok: false, error: err && err.message ? err.message : String(err) }, 500);\n' +
          '    }\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const swRe = new RegExp('<script>\\(\\(\\)=>\\{[\\s\\S]*?serviceWorker[\\s\\S]*?<' + '/script>', 'gi');
        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        let cleaned = String(rawHtml || '')
          .replace(swRe, '')
          .replace(cfRe, '')
          .replace('className:`brand`,href:`/`', 'className:`brand`,href:`./`')
          .replace(/location\.reload\(\)/g, 'window.top.location.reload()')
          .replaceAll('구글 시트에 저장했어', '클라우드에 저장했어 (시트 자동 백업)')
          .replaceAll('구글 시트 연결됨', '클라우드 연결됨 · 시트 자동 백업');

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function boot() {
        const text = await prefetchShellPromise;
        if (text && (text.includes('workout-generic-shell-v1') || text.includes('운동기록01'))) {
          await prefetchMainPromise;
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectBridgeIntoAppHtml(text);
          setTimeout(() => bootOverlay.classList.add('hidden'), 150);
          return;
        }
        bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 확인해 주세요.';
      }

      boot();
    })();
  </script>
</body>
</html>
